<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Article — Angelo Guarnerio</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>

<header class="nav scrolled" id="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="../">
      <img class="brand-mark" src="../assets/favicon.svg" alt="">
      Angelo Guarnerio
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
      <svg class="i i-open"><use href="../assets/icons.svg#menu"/></svg>
      <svg class="i i-close"><use href="../assets/icons.svg#x"/></svg>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="../#news"><svg class="i"><use href="../assets/icons.svg#clock"/></svg>News</a></li>
      <li><a href="../#research"><svg class="i"><use href="../assets/icons.svg#flask"/></svg>Research</a></li>
      <li><a href="../#projects"><svg class="i"><use href="../assets/icons.svg#code"/></svg>Projects</a></li>
      <li><a href="../#publications"><svg class="i"><use href="../assets/icons.svg#book"/></svg>Publications</a></li>
      <li><a href="../#about"><svg class="i"><use href="../assets/icons.svg#heart"/></svg>About</a></li>
      <li><a class="active" href="./"><svg class="i"><use href="../assets/icons.svg#pen"/></svg>Writing</a></li>
      <li><a class="nav-cta" href="../#contact"><svg class="i"><use href="../assets/icons.svg#mail"/></svg>Get in touch</a></li>
    </ul>
  </div>
</header>

<main class="article">
  <div class="wrap">
    <div class="article-inner">
      <a class="back" href="./"><svg class="i"><use href="../assets/icons.svg#arrow-left"/></svg>All articles</a>
      <div id="article">
        <div class="loading"><span class="spinner"></span>Loading article…</div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="year">2026</span> Angelo Guarnerio</span>
    <nav class="social" aria-label="Social">
      <a href="mailto:angelo.guarnerio@gmail.com" aria-label="Email"><svg class="i"><use href="../assets/icons.svg#mail"/></svg></a>
      <a href="https://www.linkedin.com/in/angelo-guarnerio" target="_blank" rel="noopener" aria-label="LinkedIn"><svg class="i"><use href="../assets/icons.svg#linkedin"/></svg></a>
      <a href="https://github.com/ng3l0" target="_blank" rel="noopener" aria-label="GitHub"><svg class="i"><use href="../assets/icons.svg#github"/></svg></a>
    </nav>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="../assets/js/site.js" defer></script>
<script>
  (async () => {
    const root = document.getElementById('article');
    const slug = new URLSearchParams(location.search).get('post');
    const icon = (n) => `<svg class="i"><use href="../assets/icons.svg#${n}"/></svg>`;
    const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmt = (d) => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    if (!slug || !/^[a-z0-9-]+$/i.test(slug)) { location.replace('./'); return; }

    try {
      const [metaRes, mdRes] = await Promise.all([fetch('../posts/index.json'), fetch(`../posts/${slug}.md`)]);
      if (!mdRes.ok) throw new Error('not found');
      const posts = await metaRes.json().catch(() => []);
      const meta = (Array.isArray(posts) ? posts : []).find((p) => p.slug === slug) || {};
      const md = await mdRes.text();

      // The first "# Title" line becomes the page header
      const lines = md.split('\n');
      const mdTitle = lines[0].startsWith('# ') ? lines[0].slice(2).trim() : null;
      const body = mdTitle ? lines.slice(1).join('\n').trimStart() : md;
      const title = meta.title || mdTitle || 'Article';
      const minutes = Math.max(1, Math.round(body.split(/\s+/).length / 220));

      document.title = `${title} — Angelo Guarnerio`;
      marked.use({ gfm: true, breaks: true });
      root.innerHTML = `
        <header class="article-head">
          <h1>${esc(title)}</h1>
          <div class="article-meta">
            ${meta.date ? `<span>${icon('calendar')}${fmt(meta.date)}</span>` : ''}
            <span>${icon('clock')}${minutes} min read</span>
          </div>
        </header>
        <div class="prose">${marked.parse(body)}</div>`;
      root.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
    } catch {
      root.innerHTML = `
        <div class="empty">
          <span class="i-badge heart">${icon('file-text')}</span>
          <h2>Article not found.</h2>
          <p>It may have moved, or it's still a draft.</p>
          <div style="margin-top:24px"><a class="btn btn-ghost" href="./">${icon('arrow-left')} All articles</a></div>
        </div>`;
    }
  })();
</script>
</body>
</html>
