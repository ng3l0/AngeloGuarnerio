# Publishes the site to GitHub Pages.
# Runs on every push to main, once a day (to pick up new Substack articles),
# and on demand from the Actions tab ("Run workflow").
# Requires: Settings → Pages → Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # every day around 07:17 Zurich time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest Substack articles
        run: python3 scripts/fetch_substack.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
